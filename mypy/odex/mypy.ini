# Global options:

[mypy]
warn_unused_configs = True
packages = ['aspose-words','bs4','configparser','datetime','django','docxtpl','flask','lxml','matplotlib','mechanize','mock','multidict','numpy','obspy','openpyxl','pandas','pytz','regex','rsa','sklearn','scipy','seaborn','selenium','sqlalchemy','statistics','sympy','tensorflow','texttable','xlrd','xlwt']
mypy_path = out

ignore_missing_imports = False
follow_imports = silent

disallow_untyped_calls = False
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_subclassing_any = False
disallow_untyped_decorators = False

implicit_optional = True
allow_redefinition = True
strict_equality = False
follow_imports_for_stubs = True
disable_error_code = import-untyped